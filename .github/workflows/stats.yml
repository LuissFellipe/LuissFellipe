name: Update GitHub Stats

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: update-stats
      cancel-in-progress: true # Cancela a anterior, a mais recente vence

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Stats Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=LuissFellipe&show_icons=true&theme=radical&count_private=true&locale=pt-br&layout=compact
          path: profile/stats.svg
          token: ${{ secrets.TOM }}
